# Só nos testes (classpath:/config/ tem precedência sobre o application.properties principal, que continua valendo).
# Cada contexto Spring de teste ganha o próprio banco H2: sem isso, um contexto com seed enche o banco que um
# contexto sem seed também enxerga, e o resultado depende da ordem dos testes.
spring.datasource.url=jdbc:h2:mem:tribia-teste-${random.uuid};DB_CLOSE_DELAY=-1
