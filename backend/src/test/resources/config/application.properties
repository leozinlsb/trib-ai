# Só nos testes (classpath:/config/ tem precedência sobre o application.properties principal, que continua valendo).
# Cada contexto Spring de teste ganha o próprio banco H2 em memória: sem isso, um contexto com seed enche o banco
# que um contexto sem seed também enxerga, e o resultado depende da ordem dos testes.
spring.datasource.url=jdbc:h2:mem:tribia-teste-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Testes nunca usam a IA de verdade, mesmo com GEMINI_API_KEY definida na máquina (gastaria cota e deixaria os
# resultados não determinísticos). O GeminiContratoTest lê a variável diretamente, de propósito.
tribia.llm.api-key=

# Inteligência Fiscal: processa a análise na própria requisição, para os testes verem o resultado final
tribia.fiscal.sincrono=true
