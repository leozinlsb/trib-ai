spring.application.name=tribia

# A calculadora offline da Receita sobe 8080 (API), 8081, 8082 (Simples Nacional) e 80
server.port=8090

# Banco H2 em ARQUIVO (backend/data/): uploads, revisões e o cache aprendido sobrevivem a reinícios.
# Para começar do zero, pare a API e apague a pasta data/ (ou use POST /api/demo/reiniciar no profile demo).
spring.datasource.url=jdbc:h2:file:./data/tribia
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# data.sql roda depois que o Hibernate cria as tabelas (e usa MERGE: pode rodar a cada inicialização)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Upload de XMLs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Origens que podem chamar a API pelo navegador (front). Padrão: qualquer porta em localhost.
tribia.cors.origens=http://localhost:[*],http://127.0.0.1:[*]

# ---- Acesso ----
# Administrador criado na inicialização (o banco é em memória). Sem senha definida, uma senha aleatória é
# gerada e aparece no log. Para fixar, use a variável de ambiente TRIBIA_ADMIN_SENHA (não coloque senha aqui).
tribia.admin.nome=Administrador
tribia.admin.email=admin@tribia.local
tribia.admin.senha=
# Configurações locais da máquina, fora do Git: backend/application-local.properties e o .env da raiz do
# repositório (GEMINI_API_KEY=...). Variáveis de ambiente do sistema continuam tendo prioridade.
spring.config.import=optional:file:./application-local.properties,optional:file:../.env[.properties],optional:file:./.env[.properties]
# Sessão em cookie HttpOnly
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax

# Importa resources/seed/{cnpj}/*.xml na inicialização (notas de demonstração)
tribia.seed.enabled=true
# Na inicialização, classifica (cache do seed) e calcula as notas de demonstração
tribia.seed.calcular=true

# ---- Alíquotas (em %) ----
# Hoje, Lucro Real (não cumulativo): crédito das compras e estorno nas devoluções
tribia.aliquotas.hoje.pis-nao-cumulativo=1.65
tribia.aliquotas.hoje.cofins-nao-cumulativo=7.60
# Hoje, Lucro Presumido (cumulativo): estorno do débito nas devoluções de venda
tribia.aliquotas.hoje.pis-cumulativo=0.65
tribia.aliquotas.hoje.cofins-cumulativo=3.00
# CSTs de PIS/Cofins tributados (01 alíquota básica, 02 diferenciada, 03 por unidade)
tribia.aliquotas.hoje.cst-com-credito=01,02,03
# 2027: a CBS ainda não tem alíquota oficial (estimativa de mercado, ROIT). IBS simbólico: 0,05% + 0,05%.
tribia.aliquotas.ano2027.cbs=9.43
tribia.aliquotas.ano2027.ibs-uf=0.05
tribia.aliquotas.ano2027.ibs-mun=0.05
tribia.aliquotas.ano2027.cbs-estimativa=true
# Redução da CBS em 2027-2028 (em pontos percentuais). Fontes secundárias citam 0,1 p.p. para compensar o IBS
# simbólico, mas o texto legal não foi conferido: fica 0 até a confirmação (ver PENDENCIAS.md).
tribia.aliquotas.ano2027.reducao-cbs-transicao=0.0

# ---- Cálculo ----
# AUTO = oficial e, se falhar, simplificada (com aviso) | OFICIAL | SIMPLIFICADA
tribia.calculo.modo=AUTO
# Todas as notas são calculadas "como se" fossem de 2027
tribia.calculo.data-fato-gerador=2027-01-15
# LC 214, art. 12, § 2º, V: ICMS, ISS, PIS e Cofins não integram a base do IBS/CBS de 2026 a 2032
tribia.calculo.excluir-tributos-da-base=true
# Compra de fornecedor do Simples: o crédito real é limitado ao que ele recolheu no Simples (art. 47), valor que
# a nota não traz. SEM_CREDITO (conservador) | INTEGRAL (como se fosse regime regular)
tribia.calculo.credito-fornecedor-simples=SEM_CREDITO
# Compra cujo cClassTrib corrigido na revisão difere do destacado pelo fornecedor (decisão R2, 08/10/2026):
# MENOR = menor crédito entre os dois (padrão, conservador); NOTA = segue a nota; REVISAO = segue a correção.
# Aguarda confirmação de especialista (LC 214, art. 47).
tribia.calculo.credito-compra-divergente=MENOR

# ---- Calculadora RTC oficial (offline), roda à parte: ver README ----
tribia.calculadora.url=http://localhost:8080/api
tribia.calculadora.timeout-conexao=2s
tribia.calculadora.timeout-resposta=15s

# ---- IA (Gemini). A chave NÃO fica aqui: defina a variável de ambiente GEMINI_API_KEY ----
tribia.llm.url=https://generativelanguage.googleapis.com/v1beta
# Em ordem de preferência: se o primeiro falhar (sobrecarga, cota), tenta o próximo
tribia.llm.modelos=gemini-3.5-flash,gemini-3.5-flash-lite
tribia.llm.api-key=${GEMINI_API_KEY:}
tribia.llm.timeout-conexao=3s
tribia.llm.timeout-resposta=60s
tribia.llm.itens-por-chamada=40
# Sem IA (fora do ar, sem chave) e sem resposta gravada: sugere pela regra oficial do NCM, com confiança baixa
# (vai para a revisão). false = deixa o item pendente.
tribia.classificacao.fallback-regra=true
# Códigos que dependem de quem compra (produtor rural, administração pública, Zona Franca...), fora do alcance
# de uma NF-e entre empresas comuns: a IA não os recebe como opção (a revisão manual ainda pode usá-los).
tribia.classificacao.codigos-por-adquirente=200001,200002,200005,200006,200008,200010,200011,200012,200015,200020,200022,200023,200024,200038,200043,200044,515001

# Item vai para a revisão se não tiver classificação, não estiver aceito ou tiver confiança abaixo disto
tribia.revisao.confianca-minima=0.70

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
