spring.application.name=tribia

# A calculadora offline da Receita ocupa a 8080
server.port=8081

# Banco H2 em memória (recriado a cada inicialização)
spring.datasource.url=jdbc:h2:mem:tribia;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# data.sql roda depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Upload de XMLs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Importa resources/seed/{cnpj}/*.xml na inicialização (notas de demonstração)
tribia.seed.enabled=true

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
