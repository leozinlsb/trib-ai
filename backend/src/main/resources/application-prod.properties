# Profile de hospedagem (ativado pelo Dockerfile: SPRING_PROFILES_ACTIVE=prod). Fecha o que só serve para
# desenvolvimento. Variáveis obrigatórias: TRIBIA_ADMIN_SENHA (12+ caracteres). Opcionais: GEMINI_API_KEY,
# TRIBIA_DEMO_HABILITADO=true (só num ambiente de demonstração com dados fictícios).

# Console H2 executa SQL arbitrário (e, no H2, código Java): nunca exposto fora da máquina de desenvolvimento
spring.h2.console.enabled=false

# Documentação interativa da API só em desenvolvimento
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Atrás do proxy HTTPS da hospedagem: cookies só trafegam em HTTPS e o Spring enxerga o esquema original
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# Sem senha fixa, o administrador nasceria com senha aleatória impressa no log da hospedagem
tribia.admin.exigir-senha=true

# Rotas /api/demo/* (reiniciar apaga uploads e revisões): desligadas, a não ser que o ambiente seja de demonstração
tribia.demo.habilitado=${TRIBIA_DEMO_HABILITADO:false}
