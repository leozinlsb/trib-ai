# Profile da apresentação: mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# - libera /api/demo/status (checklist) e /api/demo/reiniciar (volta ao estado inicial entre ensaios)
# - se a IA falhar (sem internet, sem cota), usa as respostas da IA gravadas antes em demo/respostas-ia.json
# - a calculadora já tem plano B próprio: no modo AUTO, cai no cálculo simplificado (mesmos valores)
tribia.demo.habilitado=true
tribia.demo.respostas-ia=true

# Na apresentação, melhor cair rápido no plano B do que deixar a plateia esperando
tribia.llm.timeout-resposta=25s
tribia.calculadora.timeout-resposta=8s
